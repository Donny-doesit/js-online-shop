
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donald's Online Shop</title>
</head>

<body>

    <h1>Donald's Online Shop</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#product-grid">Shop</a>
        <a href="#shopping-cart">
            Cart (<span id="cart-count">0</span>)
        </a>
    </nav>

    <main>
        <h2>Welcome to My Shop</h2>
        <p>Browse our available products.</p>

        <!-- ~ Category buttons will appear here -->
        <div id="category-filters"></div>

        <!-- ~ Featured product will appear here -->
        <div id="todays-pick"></div>

        <!-- ~ Product cards will appear here -->
        <div id="product-grid"></div>

        <!-- ~ Display errors to the customer -->
        <p id="error-message" aria-live="polite"></p>

        <!-- ~ Shopping cart section -->
        <section id="shopping-cart">
            <h2>Shopping Cart</h2>

            <!-- ~ Cart items and Remove buttons -->
            <div id="cart-items"></div>

            <!-- ~ Running total -->
            <p id="cart-total">Cart Total: $0.00</p>
        </section>
    </main>

    <script type="module" src="app.js"></script>

</body>
</html>
